<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Bag</title>

<style>
body{margin:0;font-family:Arial;background:linear-gradient(#f8cdda,#fcb6d0);scroll-behavior:smooth}

.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
h1{color:#e91e63;animation:float 2s infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}

.shop-btn{
position:relative;
padding:15px 35px;
background:linear-gradient(45deg,#e91e63,#ff4081);
color:white;
border-radius:40px;
text-decoration:none;
animation:pulse 2s infinite;
overflow:hidden;
}
.shop-btn:hover{transform:scale(1.1)}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(233,30,99,.6)}
70%{box-shadow:0 0 0 15px rgba(233,30,99,0)}
100%{box-shadow:0 0 0 0 rgba(233,30,99,0)}
}

.products{padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}

.card{
background:#ffe4ec;
padding:15px;
border-radius:15px;
text-align:center;
transition:.3s;
}
.card:hover{transform:scale(1.05)}

.card img{
width:100%;
border-radius:10px;
cursor:pointer;
}

.price{color:#e91e63;font-weight:bold}

.btn{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:#25D366;
color:white;
border-radius:10px;
text-decoration:none;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}
.popup img{
max-width:90%;
border-radius:10px;
}
.popup.active{
display:flex;
}

footer{text-align:center;padding:20px;color:#e91e63}
</style>

<script>
function openImage(src){
document.getElementById("popup").classList.add("active");
document.getElementById("popupImg").src = src;
}

function closePopup(){
document.getElementById("popup").classList.remove("active");
}
</script>

</head>

<body>

<div class="hero">
<h1>Lady Bag Collection</h1>
<a href="#shop" class="shop-btn">SHOP NOW ↓</a>
</div>

<div id="shop" class="products">
<div class="grid">

<div class="card">
<img src="bag1.jpeg" onclick="openImage(this.src)">
<h3>Black Bag</h3>
<p class="price">LE 799</p>
<a class="btn" href="https://wa.me/201023256648">اطلب الآن</a>
</div>

<div class="card">
<img src="bag2.jpeg" onclick="openImage(this.src)">
<h3>White Bag</h3>
<p class="price">LE 899</p>
<a class="btn" href="https://wa.me/201023256648">اطلب الآن</a>
</div>

<div class="card">
<img src="bag3.jpeg" onclick="openImage(this.src)">
<h3>Pink Bag</h3>
<p class="price">LE 750</p>
<a class="btn" href="https://wa.me/201023256648">اطلب الآن</a>
</div>

<div class="card">
<img src="bag4.jpeg" onclick="openImage(this.src)">
<h3>Mini Bag</h3>
<p class="price">LE 650</p>
<a class="btn" href="https://wa.me/201023256648">اطلب الآن</a>
</div>

</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup()">
<img id="popupImg">
</div>

<footer>
© 2026 | Lady Bag Collection
</footer>

</body>
</html>
