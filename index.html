<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Bag Collection</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#f8cdda,#fcb6d0);
text-align:center;
}

/* TITLE */
h1{
color:#e91e63;
font-size:32px;
margin-top:20px;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{letter-spacing:1px; transform:scale(1);}
to{letter-spacing:3px; transform:scale(1.05);}
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#ffe4ec;
border-radius:20px;
padding:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:15px;
cursor:pointer;
}

/* TEXT */
h3{
color:#e91e63;
margin:10px 0 5px;
}

.price{
color:#ff4081;
font-weight:bold;
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:#25D366;
color:white;
border-radius:10px;
text-decoration:none;
}

/* FOOTER */
footer{
margin-top:20px;
padding:15px;
color:#e91e63;
font-weight:bold;
}
</style>

<script>
function openImage(src){
window.open(src,'_blank');
}
</script>

</head>

<body>

<h1>Lady Bag Collection</h1>

<div class="grid">

<div class="card">
<img src="bag1.jpeg" onclick="openImage(this.src)">
<h3>Black Bag</h3>
<p class="price">LE 799</p>
<a class="btn" href="https://wa.me/201000000000">اطلب الآن</a>
</div>

<div class="card">
<img src="bag2.jpeg" onclick="openImage(this.src)">
<h3>White Bag</h3>
<p class="price">LE 899</p>
<a class="btn" href="https://wa.me/201000000000">اطلب الآن</a>
</div>

<div class="card">
<img src="bag3.jpeg" onclick="openImage(this.src)">
<h3>Pink Bag</h3>
<p class="price">LE 750</p>
<a class="btn" href="https://wa.me/201000000000">اطلب الآن</a>
</div>

<div class="card">
<img src="bag4.jpeg" onclick="openImage(this.src)">
<h3>Mini Bag</h3>
<p class="price">LE 650</p>
<a class="btn" href="https://wa.me/201000000000">اطلب الآن</a>
</div>

</div>

<footer>
© 2026 | Lady Bag Collection
</footer>

</body>
</html>
