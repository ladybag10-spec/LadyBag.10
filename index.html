<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Bag</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f8c8d8;}
.hero{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;}
.logo img{width:260px;animation: float 3s ease-in-out infinite;}
.enter-btn{margin-top:40px;padding:15px 40px;background:#ff4f8b;color:white;border:none;border-radius:30px;font-size:18px;}
.products{display:none;padding:30px;background:#f8c8d8;}
.products h2{color:#ff4f8b;text-align:center;margin-bottom:30px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.card h3,.card p{text-align:center;color:#ff4f8b;}
.order-btn{display:block;margin:10px auto;padding:10px;background:#25D366;color:white;text-decoration:none;border-radius:8px;width:80%;text-align:center;}
.slider{position:relative;}
.slider img{width:100%;border-radius:10px;cursor:pointer;}
.arrow{
position:absolute;top:50%;transform:translateY(-50%);
background:rgba(255,79,139,0.8);color:white;
width:35px;height:35px;display:flex;align-items:center;justify-content:center;
border-radius:50%;cursor:pointer;
opacity:0;transition:0.3s;
}
.slider:hover .arrow{opacity:1;}
.left{left:10px;}
.right{right:10px;}
.show-products .hero{display:none;}
.show-products .products{display:block;}
@keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-20px);}100%{transform:translateY(0);}}
</style>
</head>

<body>

<div class="hero">
<div class="logo"><img src="logo.jpeg"></div>
<button class="enter-btn" onclick="enterShop()">Enter Shop</button>
</div>

<div class="products">
<h2>Lady Bag Collection</h2>
<div class="grid">

<div class="card">
<div class="slider">
<span class="arrow left" onclick="prevImage('img1')">❮</span>
<img id="img1" src="bag1.jpeg" onclick="openImage(this.src)">
<span class="arrow right" onclick="nextImage('img1')">❯</span>
</div>
<h3>Black Bag</h3>
<p>LE 799</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب Black Bag">اطلب الآن</a>
</div>

<div class="card">
<div class="slider">
<span class="arrow left" onclick="prevImage('img2')">❮</span>
<img id="img2" src="bag2.jpeg" onclick="openImage(this.src)">
<span class="arrow right" onclick="nextImage('img2')">❯</span>
</div>
<h3>White Bag</h3>
<p>LE 899</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب White Bag">اطلب الآن</a>
</div>

<div class="card">
<div class="slider">
<span class="arrow left" onclick="prevImage('img3')">❮</span>
<img id="img3" src="bag3.jpeg" onclick="openImage(this.src)">
<span class="arrow right" onclick="nextImage('img3')">❯</span>
</div>
<h3>Pink Bag</h3>
<p>LE 750</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب Pink Bag">اطلب الآن</a>
</div>

<div class="card">
<div class="slider">
<span class="arrow left" onclick="prevImage('img4')">❮</span>
<img id="img4" src="bag4.jpeg" onclick="openImage(this.src)">
<span class="arrow right" onclick="nextImage('img4')">❯</span>
</div>
<h3>Mini Bag</h3>
<p>LE 650</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب Mini Bag">اطلب الآن</a>
</div>

</div>
</div>

<script>
function enterShop(){document.body.classList.add("show-products");}

function openImage(src){
  window.open(src, "_blank");
}

const images={
img1:["bag1.jpeg","bag1_2.jpeg","bag1_3.jpeg"],
img2:["bag2.jpeg","bag2_2.jpeg","bag2_3.jpeg"],
img3:["bag3.jpeg","bag3_2.jpeg","bag3_3.jpeg"],
img4:["bag4.jpeg","bag4_2.jpeg","bag4_3.jpeg"]
};

let currentIndex={img1:0,img2:0,img3:0,img4:0};

function nextImage(id){
currentIndex[id]++;
if(currentIndex[id]>=images[id].length){currentIndex[id]=0;}
document.getElementById(id).src=images[id][currentIndex[id]];
}

function prevImage(id){
currentIndex[id]--;
if(currentIndex[id]<0){currentIndex[id]=images[id].length-1;}
document.getElementById(id).src=images[id][currentIndex[id]];
}
</script>

</body>
</html>
