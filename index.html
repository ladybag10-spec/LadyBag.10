<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر العطور</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#111;
color:#fff;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-size:18px;
}

.hero{
height:400px;
background:linear-gradient(to right,#000,#444);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h2{
font-size:40px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
margin-bottom:20px;
}

.hero button{
padding:15px 35px;
border:none;
background:gold;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

.products{
padding:50px;
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.card{
background:white;
width:280px;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,0,0,.2);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:15px;
}

.card p{
padding:0 15px 15px;
color:#666;
}

.card button{
margin:15px;
width:calc(100% - 30px);
padding:12px;
background:black;
color:white;
border:none;
cursor:pointer;
border-radius:6px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>

</head>
<body>

<header>

<h1>🌸 متجر العطور</h1>

<nav>
<a href="#">الرئيسية</a>
<a href="#">المنتجات</a>
<a href="#">العروض</a>
<a href="#">تواصل معنا</a>
</nav>

</header>

<section class="hero">

<h2>أفضل العطور الأصلية</h2>

<p>خصومات تصل إلى 50%</p>

<button onclick="buyNow()">اطلب الآن</button>

</section>

<section class="products">

<div class="card">
<img src="https://picsum.photos/300/250?1">
<h3>عطر رجالي</h3>
<p>سعر المنتج 1200 جنيه</p>
<button onclick="buyNow()">شراء</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/250?2">
<h3>عطر نسائي</h3>
<p>سعر المنتج 950 جنيه</p>
<button onclick="buyNow()">شراء</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/250?3">
<h3>عطر فاخر</h3>
<p>سعر المنتج 1800 جنيه</p>
<button onclick="buyNow()">شراء</button>
</div>

</section>

<footer>

© 2026 جميع الحقوق محفوظة

</footer>

<script>

function buyNow(){
alert("شكراً لزيارتك متجر العطور 🌹");
}

</script>

</body>
</html>
