<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Bag</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#f8c8d8;}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.logo img{
width:260px;
animation: float 3s ease-in-out infinite;
}

.shadow{
width:140px;
height:18px;
background:rgba(0,0,0,0.2);
border-radius:50%;
margin-top:15px;
animation: shadow 3s ease-in-out infinite;
}

.enter-btn{
margin-top:40px;
padding:15px 40px;
background:#ff4f8b;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.products{
display:none;
padding:30px;
background:black;
min-height:100vh;
}

.products h2{
color:#ffd700;
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card img{
width:100%;
border-radius:10px;
}

.card h3,.card p{
color:#ffd700;
text-align:center;
}

.order-btn{
display:block;
margin:10px auto;
padding:10px;
background:#25D366;
color:white;
text-align:center;
text-decoration:none;
border-radius:8px;
width:80%;
}

.show-products .hero{display:none;}
.show-products .products{display:block;}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0);}
}

@keyframes shadow{
0%{transform:scale(1);opacity:.3;}
50%{transform:scale(1.2);opacity:.1;}
100%{transform:scale(1);opacity:.3;}
}
</style>
</head>

<body>

<div class="hero">
<div class="logo">
<img src="logo.jpeg">
</div>
<div class="shadow"></div>
<button class="enter-btn" onclick="enterShop()">Enter Shop</button>
</div>

<div class="products">
<h2>Lady Bag Collection</h2>

<div class="grid">

<div class="card">
<img src="bag1.jpg">
<h3>Black Bag</h3>
<p>LE 799</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب Black Bag" target="_blank">اطلب الآن</a>
</div>

<div class="card">
<img src="bag2.jpg">
<h3>White Bag</h3>
<p>LE 899</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب White Bag" target="_blank">اطلب الآن</a>
</div>

<div class="card">
<img src="bag3.jpg">
<h3>Pink Bag</h3>
<p>LE 750</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب Pink Bag" target="_blank">اطلب الآن</a>
</div>

<div class="card">
<img src="bag4.jpg">
<h3>Mini Bag</h3>
<p>LE 650</p>
<a class="order-btn" href="https://wa.me/201000000000?text=عايز اطلب Mini Bag" target="_blank">اطلب الآن</a>
</div>

</div>
</div>

<script>
function enterShop(){
document.body.classList.add("show-products");
}
</script>

</body>
</html>
